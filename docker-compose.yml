# Docker Compose Configuration for Car Store

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car-store-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/car-store
      - JWT_SECRET=${JWT_SECRET:-your_secret_key}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - FRONTEND_URL=http://localhost:5000
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - car-store-network
    volumes:
      - ./:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo:
    image: mongo:5.0-alpine
    container_name: car-store-db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=car-store
    restart: unless-stopped
    networks:
      - car-store-network
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: car-store-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - car-store-network

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local

networks:
  car-store-network:
    driver: bridge
